<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<title>Territory optimization — technical architecture</title>
<desc>Pipeline: synthetic data → EDA → baseline → integer programming → benchmarking → Monte Carlo → ROI/executive output</desc>

<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th  { font-size: 14px; font-weight: 500; }
  .ts  { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; }
  .leader { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 3; }

  .gray rect  { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray text.th { fill: #2C2C2A; }
  .teal rect  { fill: #E1F5EE; stroke: #0F6E56; }
  .teal text.th { fill: #04342C; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; }
  .coral text.th { fill: #4A1B0C; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .purple text.th { fill: #26215C; }
  .blue rect  { fill: #E6F1FB; stroke: #185FA5; }
  .blue text.th { fill: #042C53; }
  .green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .green text.th { fill: #173404; }

  marker path { stroke: #888780; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="gray">
  <rect x="220" y="20" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Synthetic data generation</text>
  <text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">Seed=42, reproducible</text>
</g>
<line x1="340" y1="76" x2="340" y2="104" class="arr" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="220" y="106" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="128" text-anchor="middle" dominant-baseline="central">Exploratory data analysis</text>
  <text class="ts" x="340" y="146" text-anchor="middle" dominant-baseline="central">Potential skew, geography</text>
</g>
<line x1="340" y1="162" x2="340" y2="190" class="arr" marker-end="url(#arrow)"/>

<g class="coral">
  <rect x="220" y="192" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="214" text-anchor="middle" dominant-baseline="central">Current-state baseline</text>
  <text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central">CV = 0.229 (imbalance)</text>
</g>
<line x1="340" y1="248" x2="340" y2="276" class="arr" marker-end="url(#arrow)"/>

<g class="purple">
  <rect x="180" y="278" width="320" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="300" text-anchor="middle" dominant-baseline="central">Integer programming (PuLP/CBC)</text>
  <text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">Min travel s.t. ±15% balance</text>
</g>

<line x1="280" y1="334" x2="280" y2="362" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="334" x2="400" y2="362" class="arr" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="150" y="364" width="170" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="235" y="386" text-anchor="middle" dominant-baseline="central">Benchmarking</text>
  <text class="ts" x="235" y="404" text-anchor="middle" dominant-baseline="central">3-scenario compare</text>
</g>

<g class="coral">
  <rect x="330" y="364" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="430" y="386" text-anchor="middle" dominant-baseline="central">Greedy baseline</text>
  <text class="ts" x="430" y="404" text-anchor="middle" dominant-baseline="central">Travel-only, no balance</text>
</g>

<line x1="235" y1="420" x2="340" y2="448" class="arr" marker-end="url(#arrow)"/>
<line x1="430" y1="420" x2="340" y2="448" class="arr" marker-end="url(#arrow)"/>

<g class="blue">
  <rect x="220" y="450" width="240" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="472" text-anchor="middle" dominant-baseline="central">Monte Carlo stress test</text>
  <text class="ts" x="340" y="490" text-anchor="middle" dominant-baseline="central">200 runs, ±15% noise</text>
</g>
<line x1="340" y1="506" x2="340" y2="534" class="arr" marker-end="url(#arrow)"/>

<g class="green">
  <rect x="200" y="536" width="280" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="558" text-anchor="middle" dominant-baseline="central">ROI + executive output</text>
  <text class="ts" x="340" y="576" text-anchor="middle" dominant-baseline="central">KPIs, before/after maps</text>
</g>

<text class="ts" x="60" y="46" text-anchor="start">240 zips × 6 fields</text>
<line class="leader" x1="152" y1="46" x2="218" y2="46"/>
<text class="ts" x="540" y="308" text-anchor="start">CBC solver</text>
<line class="leader" x1="502" y1="308" x2="536" y2="308"/>
<text class="ts" x="520" y="566" text-anchor="start">CSV + dashboard</text>
<line class="leader" x1="482" y1="566" x2="516" y2="566"/>

</svg>